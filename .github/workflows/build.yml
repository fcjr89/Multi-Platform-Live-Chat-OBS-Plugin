name: Build OBS Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtwebsockets'
        cache: true
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Download OBS Dependencies
      shell: powershell
      run: |
        Write-Host "Downloading OBS headers..."
        git clone --branch 30.0.2 --depth 1 https://github.com/obsproject/obs-studio.git D:\obs-studio
        
        echo "LIBOBS_INCLUDE_DIR=D:\obs-studio\libobs" >> $env:GITHUB_ENV
        
        Write-Host "Done!"
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="${env:Qt6_DIR}"
    
    - name: Build Plugin
      run: |
        cd build
        cmake --build . --config Release
    
    - name: Package Plugin with Dependencies
      shell: powershell
      run: |
        # Create package directory
        New-Item -ItemType Directory -Force -Path "package"
        
        # Copy the plugin DLL
        Copy-Item "build\Release\multi-platform-chat.dll" -Destination "package\"
        
        # Find Qt bin directory (the install-qt-action sets this)
        $qtRoot = $env:Qt6_DIR
        if ([string]::IsNullOrEmpty($qtRoot)) {
            # Fallback: search in common locations
            $qtRoot = Get-ChildItem "D:\a\Multi-Platform-Live-Chat-OBS-Plugin\Qt" -Directory | 
                      Where-Object { $_.Name -match "^6\." } | 
                      Select-Object -First 1 | 
                      ForEach-Object { Join-Path $_.FullName "msvc2019_64" }
        }
        
        $qtBinPath = Join-Path $qtRoot "bin"
        Write-Host "Qt root: $qtRoot"
        Write-Host "Qt bin path: $qtBinPath"
        
        if (-not (Test-Path $qtBinPath)) {
            Write-Host "ERROR: Qt bin path not found!"
            Write-Host "Searching for Qt installation..."
            Get-ChildItem "D:\a\Multi-Platform-Live-Chat-OBS-Plugin\" -Recurse -Filter "Qt6Core.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
        }
        
        $qtDlls = @(
            "Qt6Core.dll",
            "Qt6Gui.dll", 
            "Qt6Widgets.dll",
            "Qt6Network.dll",
            "Qt6WebSockets.dll"
        )
        
        foreach ($dll in $qtDlls) {
            $sourcePath = Join-Path $qtBinPath $dll
            if (Test-Path $sourcePath) {
                Copy-Item $sourcePath -Destination "package\"
                Write-Host "Copied: $dll"
            } else {
                Write-Host "ERROR: $dll not found at $sourcePath"
                exit 1
            }
        }
        
        # Copy Qt platform plugins
        New-Item -ItemType Directory -Force -Path "package\platforms"
        $platformPlugin = Join-Path $qtRoot "plugins\platforms\qwindows.dll"
        if (Test-Path $platformPlugin) {
            Copy-Item $platformPlugin -Destination "package\platforms\"
            Write-Host "Copied: qwindows.dll"
        } else {
            Write-Host "WARNING: qwindows.dll not found"
        }
        
        Write-Host "`nPackage contents:"
        Get-ChildItem -Recurse package
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs-plugin-windows-with-qt
        path: package/*
        if-no-files-found: error
