name: Build OBS Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtwebsockets'
        cache: true
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Download OBS Studio
      run: |
        # Download OBS Studio Windows build
        $obsVersion = "30.0.2"
        $obsUrl = "https://github.com/obsproject/obs-studio/releases/download/$obsVersion/obs-studio-$obsVersion-windows-x64.zip"
        
        Write-Host "Downloading OBS from: $obsUrl"
        
        try {
          Invoke-WebRequest -Uri $obsUrl -OutFile obs.zip -ErrorAction Stop
          Write-Host "Download successful!"
        } catch {
          Write-Host "Primary download failed, trying alternate URL..."
          $obsUrl = "https://cdn-fastly.obsproject.com/downloads/obs-studio-$obsVersion-windows-x64.zip"
          Invoke-WebRequest -Uri $obsUrl -OutFile obs.zip
        }
        
        Write-Host "Extracting OBS..."
        Expand-Archive -Path obs.zip -DestinationPath D:\obs -Force
        
        # Find the bin directory with OBS libraries
        $obsBinDir = Get-ChildItem -Path D:\obs -Recurse -Directory -Filter "bin" | Select-Object -First 1
        $obsDataDir = Get-ChildItem -Path D:\obs -Recurse -Directory -Filter "data" | Select-Object -First 1
        
        if ($obsBinDir) {
          $obsRoot = $obsBinDir.Parent.FullName
          Write-Host "OBS root found at: $obsRoot"
          
          # Set environment variables for CMake
          echo "LIBOBS_INCLUDE_DIR=$obsRoot\include" >> $env:GITHUB_ENV
          echo "LIBOBS_LIB=$obsRoot\bin\64bit\obs.lib" >> $env:GITHUB_ENV
          
          Write-Host "Contents of OBS directory:"
          Get-ChildItem -Path $obsRoot -Recurse -Depth 2
        } else {
          Write-Host "ERROR: Could not find OBS bin directory"
          exit 1
        }
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_PREFIX_PATH="${env:Qt6_DIR}"
    
    - name: Build Plugin
      run: |
        cd build
        cmake --build . --config Release
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs-plugin-windows
        path: build/Release/*.dll
        if-no-files-found: warn

  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake qt6-base-dev qt6-websockets-dev \
          libobs-dev obs-studio
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..
    
    - name: Build Plugin
      run: |
        cd build
        make -j$(nproc)
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs-plugin-linux
        path: build/*.so
        if-no-files-found: warn
