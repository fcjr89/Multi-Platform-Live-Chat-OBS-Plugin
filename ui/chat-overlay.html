<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Platform Chat Overlay</title>
    <link rel="stylesheet" href="chat-overlay.css">
</head>
<body>
    <div id="chat-container"></div>
    
    <!-- Configuration panel (hidden by default) -->
    <div id="config-panel" style="display: none;">
        <h3>Chat Overlay Settings</h3>
        <label>
            <input type="number" id="max-messages" value="10" min="5" max="50">
            Max Messages
        </label>
        <label>
            <input type="number" id="message-timeout" value="30" min="10" max="120">
            Message Timeout (seconds)
        </label>
        <label>
            <input type="checkbox" id="show-avatars" checked>
            Show Avatars
        </label>
        <label>
            <input type="checkbox" id="show-badges" checked>
            Show Badges
        </label>
        <label>
            <input type="checkbox" id="show-platform" checked>
            Show Platform Badge
        </label>
    </div>

    <script src="chat-overlay.js"></script>
</body>
</html>
